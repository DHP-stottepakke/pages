# Tools and resources referenced in the page text with {% tool "id" %}.
# Each page that uses a tag gets a "Tools and resources on this page" table.
# Documentation: https://elixir-belgium.github.io/elixir-toolkit-theme/resource_table
# and the "Tools and resources" section of pages/about/styleguide.md.
#
# Fields: id (kebab-case), name (shown in the text), url (https), description
# (one sentence, no quotation marks or apostrophes), optional instance_of and
# how_to_access, and optional registry keys: biotools (bio.tools id),
# fairsharing (DOI suffix without "FAIRsharing."), tess (TeSS search query)
# and europmc (PubMed ID). Keep the list sorted by id.

