name: Markdown Lint

# PRs use pull_request_target so the token can post review suggestions on PRs from forks as well.
# That token has write access, so the job never runs code from the PR: it checks out the base
# branch (lint config, this workflow) and only copies the PR's changed Markdown pages on top.
# Changes to .markdownlint.jsonc or this workflow in a PR therefore take effect once merged.
on:
  push:
    paths:
      - "pages/**/*.md"
      - ".markdownlint.jsonc"
      - ".github/workflows/markdown-lint.yml"
  pull_request_target:
    branches: ["main"]
    paths:
      - "pages/**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  checks: write # reviewdog reports findings as a check on the PR head commit
  pull-requests: write # reviewdog posts fix suggestions as PR review comments

env:
  MARKDOWNLINT_CLI2: markdownlint-cli2@0.23.3
  # Rules are configured in .markdownlint.jsonc (also used by the VS Code markdownlint extension).
  GLOB: "pages/**/*.md"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to diff against the PR base / previous push
          persist-credentials: false

      # Lints only the Markdown pages added or modified by the PR (or push). A manual run, or a pushed
      # change to the lint config or this workflow, lints all pages, since it can affect every file.
      # For a PR, the changed pages are copied from the PR head; symlinks are skipped.
      - name: Find changed files
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
            files=""
            for path in $(git diff --name-only --diff-filter=ACMR "$BASE...$PR_HEAD" -- ':(glob)pages/**/*.md'); do
              case $(git ls-tree --format='%(objectmode)' "$PR_HEAD" -- "$path") in
                100644|100755) ;;
                *) continue ;;
              esac
              mkdir -p "$(dirname "$path")"
              git show "$PR_HEAD:$path" > "$path"
              files="$files$path "
            done
          elif [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$GLOB"
          elif git diff --quiet "$BASE...HEAD" -- .markdownlint.jsonc .github/workflows/markdown-lint.yml; then
            files=$(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- ':(glob)pages/**/*.md' | tr '\n' ' ')
          else
            files="$GLOB"
          fi
          echo "Linting: ${files:-nothing}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # The copied PR pages are the starting point for the auto-fix suggestions below.
      - name: Stage PR pages
        if: ${{ github.event_name == 'pull_request_target' && steps.changed.outputs.files != '' }}
        run: git add -A pages

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.2

      # Annotates every finding as a warning; findings never fail the job.
      - name: Report findings
        if: ${{ steps.changed.outputs.files != '' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -f # pass the glob to markdownlint unexpanded
          npx --yes "$MARKDOWNLINT_CLI2" $FILES 2>&1 | reviewdog \
            -efm="%f:%l:%c %trror %m" -efm="%f:%l %trror %m" \
            -efm="%f:%l:%c %tarning %m" -efm="%f:%l %tarning %m" \
            -name=markdownlint \
            -reporter=${{ github.event_name == 'pull_request_target' && 'github-pr-check' || 'github-annotations' }} \
            -filter-mode=nofilter \
            -fail-level=none

      # Runs the auto-fixer and posts the resulting changes as review suggestions
      # that can be applied with "Commit suggestion".
      - name: Apply auto-fixes
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' && steps.changed.outputs.files != '' }}
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -f
          npx --yes "$MARKDOWNLINT_CLI2" --fix $FILES || true

      - name: Suggest fixes
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' && steps.changed.outputs.files != '' }}
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: markdownlint --fix
          level: warning
          filter_mode: diff_context
          fail_level: none
